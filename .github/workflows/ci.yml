name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: PnPPowerShell.MCPServer.csproj
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    # Legacy PnP runs only in Windows PowerShell 5.1, so integration coverage runs on Windows.
    # Integration tests skip themselves if the module is missing, so a failure here is a real failure.
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SharePointPnPPowerShellOnline
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name SharePointPnPPowerShellOnline -Scope CurrentUser -Force

      - name: Test
        shell: bash
        # --blame-hang: a test that hangs otherwise runs until the job timeout, and an aborted run can
        # still exit 0 and report green. A non-terminating search loop reached review that way once.
        run: dotnet test tests/PnPPowerShell.MCPServer.Tests --configuration Release --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 5m

  test-bare:
    # The mirror of the job above: a runner without the legacy PnP module, for cold-start diagnostics.
    # the cold-start states can be manufactured for real. It is also the only check on the offline
    # claims — the vendored indexes, recorded playback and the stdio protocol tests all have to pass
    # here, on a machine that could not reach a tenant even if it wanted to.
    name: Test (bare runner, no legacy module)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Built explicitly: StdioProtocolTests launches the server's own build output, which the test
      # project's own build does not guarantee is present.
      - name: Build the server
        shell: bash
        run: dotnet build "$PROJECT" --configuration Release

      - name: Test
        shell: bash
        # --blame-hang: a test that hangs otherwise runs until the job timeout, and an aborted run can
        # still exit 0 and report green. A non-terminating search loop reached review that way once.
        run: dotnet test tests/PnPPowerShell.MCPServer.Tests --configuration Release --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 5m

  build:
    # Builds the Windows host RID on each supported architecture.
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build "$PROJECT" --configuration Release
        shell: bash

      - name: Pack ${{ matrix.rid }}
        shell: bash
        run: dotnet pack "$PROJECT" --configuration Release --runtime ${{ matrix.rid }} --output artifacts

      - name: Verify the RID package actually contains the executable
        shell: bash
        run: |
          set -euo pipefail
          rid='${{ matrix.rid }}'
          pkg="$(find artifacts -name "*.${rid}.*.nupkg" -print -quit)"
          if [ -z "$pkg" ]; then
            echo "::error::No ${rid} package was produced"
            exit 1
          fi
          # Expected layout: tools/any/<rid>/PnPPowerShell.MCPServer[.exe]
          if ! unzip -l "$pkg" | grep -qE "tools/[^/]+/${rid}/PnPPowerShell\.MCPServer(\.exe)?$"; then
            echo "::error::$pkg contains no executable for ${rid}"
            unzip -l "$pkg"
            exit 1
          fi
          echo "ok: $pkg ($(du -h "$pkg" | cut -f1))"

  rid-coverage:
    # The release workflow must build a package for every RID the csproj declares.
    # If a RID is added to <RuntimeIdentifiers> without a matching release matrix leg,
    # the wrapper will advertise a package that is never published — which is exactly the
    # failure mode that broke 0.1.1-beta.
    name: Release matrix covers all RIDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare csproj RIDs against the release matrix
        shell: bash
        run: |
          set -euo pipefail
          rids="$(sed -n 's:.*<RuntimeIdentifiers>\(.*\)</RuntimeIdentifiers>.*:\1:p' "$PROJECT" | head -n1 | tr ';' ' ')"
          if [ -z "$rids" ]; then
            echo "::notice::No <RuntimeIdentifiers> in $PROJECT — nothing to check"
            exit 0
          fi

          # Only count RIDs that are actually packed — i.e. a `rid:` matrix entry or a
          # `--runtime <rid>` argument. Mentions in comments do not count.
          covered="$(grep -vE '^[[:space:]]*#' .github/workflows/release.yml \
            | grep -oE '(rid: |--runtime )[A-Za-z0-9.-]+' \
            | sed -E 's/^(rid: |--runtime )//' \
            | sort -u)"
          echo "Packed by release.yml: $(echo $covered)"

          missing=0
          for rid in $rids; do
            if echo "$covered" | grep -qx "$rid"; then
              echo "  ok      $rid"
            else
              echo "  MISSING $rid"
              echo "::error::RID '$rid' is declared in $PROJECT but never packed by .github/workflows/release.yml"
              missing=1
            fi
          done
          exit "$missing"

  mcp-registry-manifest:
    # A bad server.json only fails at release, after NuGet.org already holds the version.
    name: MCP Registry manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check server.json against the csproj and README
        shell: bash
        run: |
          set -euo pipefail
          csproj="$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' "$PROJECT" | head -n1)"
          name="$(jq -r .name .mcp/server.json)"
          failed=0

          for v in "$(jq -r .version .mcp/server.json)" $(jq -r '.packages[].version' .mcp/server.json); do
            if [ "$v" != "$csproj" ]; then
              echo "::error file=.mcp/server.json::version '$v' does not match <PackageVersion> '$csproj'"
              failed=1
            fi
          done

          if ! grep -qF "mcp-name: $name" README.md; then
            echo "::error file=README.md::no 'mcp-name: $name' line; the MCP Registry would reject the package"
            failed=1
          fi
          exit "$failed"

      - name: Validate server.json with mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate .mcp/server.json
